[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n100-financial-intelligence-platform"
version = "0.1.0"
description = "N100 Financial Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
nifty100-etl = "nifty100_etl.loader:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
