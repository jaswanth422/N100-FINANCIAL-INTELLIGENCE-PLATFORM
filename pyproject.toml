[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n100-financial-intelligence-platform"
version = "0.1.0"
description = "N100 Financial Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "pypdf>=6,<7",
  "reportlab>=4.2,<5",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
  "streamlit>=1.60,<2",
]

[project.scripts]
nifty100-etl = "nifty100_etl.loader:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
