name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install pytest-cov pytest-html

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Type check (mypy, non-blocking)
        continue-on-error: true
        run: python -m mypy src

      - name: Run tests with coverage
        env:
          PYTHONPATH: src
        run: |
          mkdir -p reports
          python -m pytest -v \
            --cov=analytics --cov=api --cov=dashboard --cov=etl --cov=nifty100_etl \
            --cov=nlp --cov=reports --cov=screener \
            --cov-report=term-missing --cov-report=xml \
            --html=reports/pytest_report.html --self-contained-html

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: |
            reports/pytest_report.html
            coverage.xml
          if-no-files-found: ignore
